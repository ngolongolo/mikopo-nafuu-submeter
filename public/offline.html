<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#112e35">
    <title>Offline • Mikopo Nafuu</title>
    <style>
        *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f7f5;color:#112e35;font:15px/1.55 system-ui,-apple-system,sans-serif}.offline-card{max-width:520px;padding:42px;border:1px solid #dfe8e3;border-radius:22px;background:#fff;text-align:center;box-shadow:0 25px 60px rgba(17,46,53,.1)}.offline-icon{display:grid;place-items:center;width:68px;height:68px;margin:0 auto 22px;border-radius:20px;background:#112e35;color:#d2eb89;font-size:34px;font-weight:900}h1{margin:0 0 10px;font-size:30px}p{margin:0 0 24px;color:#63746f}button{border:0;border-radius:9px;padding:12px 20px;background:#087f75;color:#fff;font:inherit;font-weight:700;cursor:pointer}
    </style>
</head>
<body>
    <main class="offline-card">
        <div class="offline-icon">↯</div>
        <h1>You are offline</h1>
        <p>Reconnect to securely access applications, loans and repayment information. Financial pages are not stored offline.</p>
        <button onclick="window.location.reload()">Try again</button>
    </main>
</body>
</html>
